<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Tug'ilgan kuningiz bilan! - {{ name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            color: #fff;
            position: relative;
        }

        /* Yulduzlar fon */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -20px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Balloonlar */
        .balloons {
            position: fixed;
            bottom: -100px;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: float-up 12s ease-in forwards;
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 40px;
            background: rgba(255,255,255,0.5);
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: inherit;
            border-radius: 50%;
            filter: brightness(0.8);
        }

        @keyframes float-up {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
        }

        /* Asosiy kontent */
        .container {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .cake {
            font-size: 80px;
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.6));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.2rem, 8vw, 4rem);
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 4s ease infinite, fade-in 1.5s ease;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(255, 150, 150, 0.3);
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .name {
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 700;
            color: #feca57;
            margin: 15px 0;
            animation: fade-in 2s ease 0.5s both;
            text-shadow: 0 0 30px rgba(254, 202, 87, 0.5);
        }

        .message {
            font-size: clamp(1rem, 3vw, 1.3rem);
            max-width: 500px;
            line-height: 1.7;
            margin: 20px 0 30px;
            opacity: 0.95;
            animation: fade-in 2s ease 1s both;
            padding: 0 15px;
        }

        .from {
            font-size: 1.1rem;
            color: #48dbfb;
            font-style: italic;
            animation: fade-in 2s ease 1.5s both;
            margin-bottom: 40px;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tugmalar */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fade-in 2s ease 2s both;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-music {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            box-shadow: 0 8px 25px rgba(238, 90, 36, 0.4);
        }

        .btn-music:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(238, 90, 36, 0.6);
        }

        .btn-confetti {
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            color: white;
            box-shadow: 0 8px 25px rgba(10, 189, 227, 0.4);
        }

        .btn-confetti:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(10, 189, 227, 0.6);
        }

        .btn-balloons {
            background: linear-gradient(135deg, #ff9ff3, #f368e0);
            color: white;
            box-shadow: 0 8px 25px rgba(243, 104, 224, 0.4);
        }

        .btn-balloons:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(243, 104, 224, 0.6);
        }

        /* Shamlar */
        .candles {
            display: flex;
            gap: 12px;
            margin: 25px 0;
            animation: fade-in 2s ease 0.8s both;
        }

        .candle {
            width: 12px;
            height: 45px;
            background: linear-gradient(to top, #feca57, #ff9ff3);
            border-radius: 4px;
            position: relative;
            box-shadow: 0 0 15px rgba(254, 202, 87, 0.5);
        }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 20px;
            background: radial-gradient(ellipse at bottom, #ff9f43 0%, #ee5a24 40%, transparent 70%);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.4s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px #ff9f43);
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 1; }
        }

        /* Gift box animatsiya */
        .gift {
            font-size: 50px;
            margin-top: 20px;
            animation: swing 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        /* Audio yashirin */
        audio {
            display: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .cake { font-size: 60px; }
            .btn { padding: 12px 20px; font-size: 0.9rem; }
            .candles { gap: 8px; }
            .candle { width: 10px; height: 35px; }
        }

        /* Music playing indicator */
        .music-playing .btn-music {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(238, 90, 36, 0.4); }
            50% { box-shadow: 0 8px 35px rgba(238, 90, 36, 0.8); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="confetti-container" id="confetti"></div>
    <div class="balloons" id="balloons"></div>

    <div class="container">
        <div class="cake">🎂</div>
        
        <h1 class="title">Tug'ilgan kuningiz bilan!</h1>
        
        <div class="name">{{ name }} ✨</div>
        
        <div class="candles" id="candles">
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
        </div>

        <p class="message">{{ message }}</p>
        
        <p class="from">— {{ from_name }} 💙</p>

        <div class="gift">🎁</div>

        <div class="controls">
            <button class="btn btn-music" id="musicBtn" onclick="toggleMusic()">
                🎵 Musiqa
            </button>
            <button class="btn btn-confetti" onclick="launchConfetti()">
                🎊 Confetti
            </button>
            <button class="btn btn-balloons" onclick="launchBalloons()">
                🎈 Sharlar
            </button>
        </div>
    </div>

    <!-- Background music - siz o'zingizning mp3 faylingizni static/audio/ ga qo'yishingiz mumkin -->
<audio id="bgMusic" loop>
    <source src="{% static 'audio/happy_birthday.mp3' %}" type="audio/mpeg">
</audio>

    <script>
        // Yulduzlar yaratish
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Confetti
        const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#5f27cd', '#ff9f43'];
        
        function launchConfetti() {
            const container = document.getElementById('confetti');
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                confetti.style.width = (Math.random() * 10 + 6) + 'px';
                confetti.style.height = (Math.random() * 10 + 6) + 'px';
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        // Balloonlar
        const balloonColors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#5f27cd'];
        
        function launchBalloons() {
            const container = document.getElementById('balloons');
            for (let i = 0; i < 12; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 90 + 5 + '%';
                balloon.style.backgroundColor = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                balloon.style.animationDuration = (Math.random() * 4 + 8) + 's';
                balloon.style.animationDelay = Math.random() * 1.5 + 's';
                balloon.style.width = (Math.random() * 20 + 50) + 'px';
                balloon.style.height = (Math.random() * 25 + 65) + 'px';
                container.appendChild(balloon);
                
                setTimeout(() => balloon.remove(), 14000);
            }
        }

        // Musiqa
        let isPlaying = false;
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                musicBtn.innerHTML = '🎵 Musiqa';
                document.body.classList.remove('music-playing');
            } else {
                audio.play().catch(e => {
                    console.log('Musiqa avtomatik ishlashi uchun tugmani bosing');
                });
                musicBtn.innerHTML = '⏸️ To\'xtatish';
                document.body.classList.add('music-playing');
            }
            isPlaying = !isPlaying;
        }

        // Sahifa yuklanganda
        window.addEventListener('load', () => {
            createStars();
            // Boshida confetti va balloon
            setTimeout(launchConfetti, 800);
            setTimeout(launchBalloons, 1500);
            // Har 8 sekundda confetti
            setInterval(launchConfetti, 8000);
        });

        // Click qilganda ham confetti
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.btn')) {
                // faqat tugmalar emas joyga bosilganda
            }
        });
    </script>
</body>
</html>
